; PlatformIO Project Configuration File for Evil-M5Project (Cardputer)

[platformio]
default_envs = cardputer-cn
src_dir = .pio_cardputer

[env:cardputer-cn]
platform = espressif32
board = m5stack-stamps3
framework = arduino
board_build.mcu = esp32s3
board_build.flash_mode = dio
board_build.f_flash = 80000000L
board_build.partitions = partitions.csv
lib_ldf_mode = deep+
build_unflags = 
	-ggdb
	-g
build_flags = 
	-D ARDUINO_M5STACK_CARDPUTER
	-D BOARD_HAS_PSRAM=0
	-D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-Wl,-z,muldefs
	-w
	-g0
	-fno-var-tracking
	-fno-var-tracking-assignments
	--param=ggc-min-expand=10
	--param=ggc-min-heapsize=32768
	-I src
	-I .
lib_deps = 
	m5stack/M5Cardputer @ ^1.1.1
	m5stack/M5Unified @ ^0.2.29
	m5stack/M5GFX @ ^0.2.36
	adafruit/Adafruit NeoPixel @ ^1.12.3
	dvarrel/ESPping @ ^1.0.5
	stevemarple/IniFile @ ^1.3.0
	mikalhart/TinyGPSPlus @ ^1.0.3
	earlephilhower/ESP8266Audio @ ^1.9.7
	jgromes/RadioLib @ ^6.6.0
	esphome/ESPAsyncWebServer-esphome @ ^3.4.0
	esphome/AsyncTCP-esphome @ ^2.1.4
	ewpa/LibSSH-ESP32 @ ^5.10.0
	bblanchon/ArduinoJson@^7.2.1
